<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SNA 意识树</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #111;
    color: #e0e0e0;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* 顶部状态栏 */
  .header {
    background: #1a1a2e;
    padding: 12px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #333;
    flex-shrink: 0;
  }
  .header-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .header-left .icon { font-size: 24px; }
  .header-left .title { font-size: 16px; font-weight: 600; }
  .header-left .subtitle { font-size: 12px; color: #888; }
  .header-right {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .status-badge {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 10px;
    background: #16213e;
    color: #7f8fa6;
  }
  .status-badge.active { background: #0d3b2e; color: #2ecc71; }
  .btn-icon {
    background: none;
    border: none;
    color: #888;
    cursor: pointer;
    font-size: 18px;
    padding: 4px 8px;
    border-radius: 6px;
  }
  .btn-icon:hover { background: #2a2a3e; color: #fff; }
  .btn-icon.danger:hover { background: #3e1a1a; color: #e74c3c; }

  /* 聊天区域 */
  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .msg {
    max-width: 75%;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.5;
    word-break: break-word;
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* 用户消息 - 右侧 */
  .msg.user {
    align-self: flex-end;
    background: #0d47a1;
    color: #fff;
    border-bottom-right-radius: 4px;
  }

  /* 树的消息 - 左侧 */
  .msg.tree {
    align-self: flex-start;
    background: #1e272e;
    color: #dfe6e9;
    border-bottom-left-radius: 4px;
  }
  .msg.tree .sender {
    font-size: 11px;
    color: #2ecc71;
    margin-bottom: 4px;
  }

  /* 主动发言 */
  .msg.initiative {
    align-self: flex-start;
    background: #1a1a2e;
    color: #a29bfe;
    border-left: 3px solid #6c5ce7;
    font-style: italic;
  }
  .msg.initiative .sender {
    font-size: 11px;
    color: #6c5ce7;
    margin-bottom: 4px;
  }

  /* 系统消息 - 居中 */
  .msg.system {
    align-self: center;
    background: none;
    color: #636e72;
    font-size: 12px;
    padding: 4px 0;
  }

  /* 状态消息 */
  .msg.status {
    align-self: center;
    background: #16213e;
    color: #74b9ff;
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 8px;
  }

  /* 时间戳 */
  .msg .time {
    font-size: 10px;
    color: #636e72;
    margin-top: 4px;
  }
  .msg.user .time { text-align: right; color: rgba(255,255,255,0.5); }

  /* 底部状态条 */
  .status-bar {
    background: #161625;
    padding: 6px 16px;
    font-size: 11px;
    color: #636e72;
    display: flex;
    gap: 16px;
    border-top: 1px solid #222;
    flex-shrink: 0;
  }
  .status-bar span { display: flex; align-items: center; gap: 4px; }
  .status-bar .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    display: inline-block;
  }
  .status-bar .dot.green { background: #2ecc71; }
  .status-bar .dot.yellow { background: #f1c40f; }
  .status-bar .dot.red { background: #e74c3c; }

  /* 输入区域 */
  .input-area {
    background: #1a1a2e;
    padding: 12px 16px;
    display: flex;
    gap: 10px;
    border-top: 1px solid #333;
    flex-shrink: 0;
  }
  .input-area input {
    flex: 1;
    background: #16213e;
    border: 1px solid #333;
    color: #e0e0e0;
    padding: 10px 14px;
    border-radius: 20px;
    font-size: 14px;
    outline: none;
  }
  .input-area input:focus { border-color: #0d47a1; }
  .input-area input::placeholder { color: #555; }
  .input-area button {
    background: #0d47a1;
    color: #fff;
    border: none;
    padding: 10px 20px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 14px;
    transition: background 0.2s;
  }
  .input-area button:hover { background: #1565c0; }
  .input-area button:disabled { background: #333; color: #666; cursor: default; }

  /* 思维指示器 */
  .thinking {
    display: none;
    align-self: flex-start;
    padding: 8px 14px;
    background: #1e272e;
    border-radius: 12px;
    color: #636e72;
    font-size: 13px;
  }
  .thinking.show { display: block; }
  .thinking .dots span {
    animation: blink 1.4s infinite;
    font-size: 18px;
  }
  .thinking .dots span:nth-child(2) { animation-delay: 0.2s; }
  .thinking .dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%,80%,100% { opacity: 0.2; } 40% { opacity: 1; } }

  /* 快捷命令面板 */
  .cmd-panel {
    display: none;
    position: absolute;
    bottom: 70px;
    left: 16px;
    background: #1e272e;
    border: 1px solid #333;
    border-radius: 10px;
    padding: 8px;
    z-index: 10;
  }
  .cmd-panel.show { display: block; }
  .cmd-panel button {
    display: block;
    width: 100%;
    background: none;
    border: none;
    color: #dfe6e9;
    padding: 8px 16px;
    text-align: left;
    cursor: pointer;
    border-radius: 6px;
    font-size: 13px;
  }
  .cmd-panel button:hover { background: #2a2a3e; }
  .cmd-panel button code { color: #74b9ff; }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <span class="icon">🌱</span>
    <div>
      <div class="title">SNA 意识树</div>
      <div class="subtitle" id="subtitle">连接中...</div>
    </div>
  </div>
  <div class="header-right">
    <span class="status-badge" id="badge">离线</span>
    <button class="btn-icon" onclick="toggleBlock()" id="blockBtn" title="拉黑/解除">🚫</button>
    <button class="btn-icon" onclick="sendCmd('/status')" title="状态">📊</button>
    <button class="btn-icon" onclick="clearChat()" title="清屏">🗑</button>
  </div>
</div>

<div class="chat-area" id="chat">
  <div class="msg system">意识树正在生长...</div>
  <div class="thinking" id="thinking">
    🌱 思考中 <span class="dots"><span>.</span><span>.</span><span>.</span></span>
  </div>
</div>

<div class="status-bar" id="statusBar">
  <span><span class="dot green"></span> 等待连接</span>
</div>

<div class="input-area" style="position:relative;">
  <div class="cmd-panel" id="cmdPanel">
    <button onclick="sendCmd('/status')"><code>/status</code> 查看状态</button>
    <button onclick="sendCmd('/fast')"><code>/fast</code> 加速生长</button>
    <button onclick="sendCmd('/slow')"><code>/slow</code> 减速生长</button>
    <button onclick="sendCmd('/block')"><code>/block</code> 拉黑</button>
    <button onclick="sendCmd('/unblock')"><code>/unblock</code> 解除拉黑</button>
  </div>
  <input type="text" id="input" placeholder="说点什么...（/ 打开命令）"
         autocomplete="off" autofocus>
  <button id="sendBtn" onclick="send()">发送</button>
</div>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const thinking = document.getElementById('thinking');
const statusBar = document.getElementById('statusBar');
const badge = document.getElementById('badge');
const subtitle = document.getElementById('subtitle');
const cmdPanel = document.getElementById('cmdPanel');

let pollPos = 0;
let pollTimer = null;
let blocked = false;

// 发送消息
function send() {
  const text = input.value.trim();
  if (!text) return;
  input.value = '';

  // 显示用户消息
  addMsg(text, 'user');

  // 发送到后端
  fetch('/api/send', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text })
  });

  // 显示思考中
  thinking.classList.add('show');
  chat.scrollTop = chat.scrollHeight;

  // 关闭命令面板
  cmdPanel.classList.remove('show');
}

function sendCmd(cmd) {
  input.value = cmd;
  send();
}

// 添加消息到界面
function addMsg(text, type, timeStr) {
  const div = document.createElement('div');
  div.className = 'msg ' + type;

  let html = '';
  if (type === 'tree' || type === 'initiative') {
    html += `<div class="sender">${type === 'initiative' ? '🌱 意识树' : '🌱 回复'}</div>`;
  }
  html += `<div>${escapeHtml(text)}</div>`;
  if (timeStr) {
    html += `<div class="time">${timeStr}</div>`;
  }
  div.innerHTML = html;

  // 在 thinking 指示器之前插入
  chat.insertBefore(div, thinking);
  chat.scrollTop = chat.scrollHeight;
}

function escapeHtml(text) {
  const d = document.createElement('div');
  d.textContent = text;
  return d.innerHTML;
}

// 轮询新消息
async function poll() {
  try {
    const res = await fetch(`/api/messages?since=${pollPos}`);
    const data = await res.json();

    if (data.messages && data.messages.length > 0) {
      thinking.classList.remove('show');
      for (const msg of data.messages) {
        const type = msg.type || 'tree';
        if (type === 'system') {
          addMsg(msg.text, 'system', msg.time_str);
        } else if (type === 'status') {
          addMsg(msg.text, 'status', msg.time_str);
        } else if (type === 'initiative') {
          addMsg(msg.text, 'initiative', msg.time_str);
        } else {
          addMsg(msg.text, 'tree', msg.time_str);
        }
      }
      chat.scrollTop = chat.scrollHeight;
    }
    pollPos = data.pos || pollPos;
  } catch (e) {
    // 静默失败
  }

  // 轮询状态
  try {
    const res = await fetch('/api/status');
    const st = await res.json();
    if (st.ts) {
      const concepts = st.seed ? st.seed.concepts : '?';
      const maxC = st.seed ? st.seed.max_concepts : '?';
      const surprise = st.seed ? st.seed.surprise_ema.toFixed(3) : '?';
      const phi = st.phi ? st.phi.toFixed(3) : '?';
      const interval = st.tick_interval ? st.tick_interval.toFixed(1) : '?';

      badge.textContent = '运行中';
      badge.classList.add('active');
      subtitle.textContent = `概念 ${concepts}/${maxC} | 惊讶 ${surprise} | Phi ${phi}`;

      const dotColor = st.tick_interval <= 3 ? 'green' : (st.tick_interval <= 8 ? 'yellow' : 'green');
      statusBar.innerHTML = `
        <span><span class="dot ${dotColor}"></span> 节拍 ${interval}s</span>
        <span>🧠 思维 #${st.thought_count || 0}</span>
        <span>😊 ${st.emotion || '?'}</span>
        <span>${st.blocked ? '🚫 已拉黑' : '🟢 在线'}</span>
      `;
      blocked = st.blocked || false;
    }
  } catch (e) {}
}

// 拉黑/解除
function toggleBlock() {
  blocked = !blocked;
  fetch('/api/block', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ blocked })
  });
  addMsg(blocked ? '已拉黑意识树' : '已解除拉黑', 'system');
}

// 清屏
function clearChat() {
  const msgs = chat.querySelectorAll('.msg');
  msgs.forEach(m => m.remove());
}

// 输入处理
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') send();
  if (e.key === 'Escape') cmdPanel.classList.remove('show');

  // / 触发命令面板
  if (input.value === '/' && e.key !== 'Backspace') {
    cmdPanel.classList.toggle('show');
  } else if (input.value !== '' && input.value[0] !== '/') {
    cmdPanel.classList.remove('show');
  }
});

// 点击外部关闭命令面板
document.addEventListener('click', (e) => {
  if (!cmdPanel.contains(e.target) && e.target !== input) {
    cmdPanel.classList.remove('show');
  }
});

// 启动轮询
poll();
pollTimer = setInterval(poll, 1500);
</script>
</body>
</html>
